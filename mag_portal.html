<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAG322 Live Stream Border</title>
    <style>
        /* Базовые настройки для экрана ТВ */
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Черный фон, как на картинке */
            overflow: hidden;
            font-family: Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Главный контейнер рамки */
        .stream-frame {
            position: absolute;
            top: 5vh;
            left: 5vw;
            width: 90vw;
            height: 90vh;
            border: 3px solid #00f0ff;
            border-radius: 4px;
            box-sizing: border-box;
            
            /* Эффект неонового свечения */
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff;
            /* Плавное мерцание неона */
            animation: neon-glow 2s infinite alternate; 
        }

        /* Верхняя плашка LIVE STREAMING */
        .live-tag {
            position: absolute;
            top: -24px; /* Смещаем вверх, чтобы перекрыть верхнюю грань */
            left: 50%;
            transform: translateX(-50%);
            background-color: #000;
            padding: 0 20px;
            height: 44px;
            border-left: 3px solid #00f0ff;
            border-right: 3px solid #00f0ff;
            border-bottom: 3px solid #00f0ff;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 5px 10px -5px #00f0ff;
            
            /* Выравнивание текста */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Текст внутри плашки */
        .live-tag span {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00f0ff;
        }

        /* Анимация пульсации неона */
        @keyframes neon-glow {
            from {
                box-shadow: 0 0 10px #00f0ff, inset 0 0 10px #00f0ff;
                opacity: 0.95;
            }
            to {
                box-shadow: 0 0 22px #00f0ff, inset 0 0 15px #00f0ff;
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Рамка -->
    <div class="stream-frame">
        <!-- Плашка с надписью -->
        <div class="live-tag">
            <span>Live Streaming</span>
        </div>
    </div>

</body>
</html>
