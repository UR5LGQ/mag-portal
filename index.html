<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MAG322 High Buffer Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000000; color: #ffffff; font-family: monospace; overflow: hidden; }
        #log { position: absolute; top: 20px; left: 20px; font-size: 24px; background: rgba(0,0,0,0.8); z-index: 9999; width: 90%; word-wrap: break-word; }
        #vol_bar { position: absolute; bottom: 50px; left: 10%; width: 80%; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #fff; display: none; z-index: 10000; }
        #vol_val { height: 100%; background: #00ff00; width: 50%; }
    </style>
</head>
<body>

<div id="log">Настройка буфера и запуск...<br></div>
<div id="vol_bar"><div id="vol_val"></div></div>

<script type="text/javascript">
    function showLog(text) {
        document.getElementById('log').innerHTML += text + "<br>";
        document.getElementById('log').style.display = 'block';
    }

    var hlsUrl = "ffrt2 https://ur5lgq-iptv-transcoder.hf.space/low.m3u8";
    var currentVolume = 50;
    var volTimer = null;

    window.onload = function() {
        try {
            if (typeof stbPlayer !== "undefined" && typeof stbPlayer.play === "function") {
                
                // Настраиваем расширенные параметры воспроизведения и буферизации
                var playOptions = {
                    url: hlsUrl,
                    // Задаем параметры буфера (значения в миллисекундах)
                    bufferStart: 4000, // Ждать накопления 4 секунд видео перед стартом (устраняет дерганье при запуске)
                    bufferTime: 8000,  // Держать в памяти до 8 секунд потока (сглаживает просадки интернета)
                    lowBufferTime: 2000 // Минимальный порог, ниже которого плеер снова уйдет в буферизацию вместо замерзания
                };

                // Запуск с новыми настройками буфера
                stbPlayer.play(playOptions);
                showLog("Видео запущено с буфером 8с.");
                
                if (typeof stbPlayer.volume !== "undefined") {
                    currentVolume = stbPlayer.volume;
                }
                
                hideLogDelayed();
            } else {
                showLog("Ошибка: объект stbPlayer не найден.");
            }
        } catch (err) {
            showLog("Ошибка stbPlayer.play: " + err.message);
        }

        // Подключение пульта
        try {
            if (typeof stbEvent !== "undefined") {
                stbEvent.onEvent = function(eventCode, info) {
                    handleStbEvent(eventCode);
                };
            }
        } catch(e){}
    };

    function hideLogDelayed() {
        setTimeout(function() {
            document.getElementById('log').style.display = 'none';
        }, 3000);
    }

    function changeVolume(dir) {
        if (dir === "up") {
            currentVolume += 5;
            if (currentVolume > 100) currentVolume = 100;
        } else {
            currentVolume -= 5;
            if (currentVolume < 0) currentVolume = 0;
        }
        try { if (typeof stbPlayer !== "undefined") { stbPlayer.volume = currentVolume; } } catch(e){}
        document.getElementById('vol_val').style.width = currentVolume + "%";
        document.getElementById('vol_bar').style.display = "block";
        clearTimeout(volTimer);
        volTimer = setTimeout(function() { document.getElementById('vol_bar').style.display = "none"; }, 2000);
    }

    function handleStbEvent(eventCode) {
        switch(parseInt(eventCode)) {
            case 1: changeVolume("up"); break;
            case 2: changeVolume("down"); break;
            case 3: try { stbPlayer.mute = !stbPlayer.mute; } catch(e){} break;
            case 5: 
                try {
                    stbPlayer.stop();
                    if (typeof gSTB !== "undefined" && typeof gSTB.LoadPage === "function") {
                        gSTB.LoadPage("file:///home/img/main_menu/index.html");
                    } else { window.location.href = "about:blank"; }
                } catch(e){ window.location.reload(); }
                break;
        }
    }

    // Клавиатурный дублер пульта
    document.addEventListener("keydown", function(event) {
        var key = event.key;
        var code = event.keyCode;
        if (key === "VolumeUp" || code === 38 || code === 175) { event.preventDefault(); changeVolume("up"); }
        else if (key === "VolumeDown" || code === 40 || code === 174) { event.preventDefault(); changeVolume("down"); }
        else if (key === "MediaStop" || code === 115 || code === 178) { event.preventDefault(); try { stbPlayer.stop(); } catch(e){} }
        else if (key === "MediaPlayPause" || code === 114 || code === 179) { event.preventDefault(); window.location.reload(); }
        else if (code === 8 || code === 27) {
            event.preventDefault();
            try { stbPlayer.stop(); gSTB.LoadPage("file:///home/img/main_menu/index.html"); } catch(e) { window.location.reload(); }
        }
    }, false);
</script>
</body>
</html>
