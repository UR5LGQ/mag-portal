<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MAG322 Custom Portal</title>
    <style>
        /* Базовые стили для HD разрешения приставки MAG */
        html, body {
            background: transparent !important; /* Полная прозрачность для MAG */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            position: relative;
        }
        
        /* На ПК включаем темную подложку для удобства отладки */
        @media screen and (min-width: 1281px) {
            html { background-color: #1a1a1a !important; }
        }

        /* АВТО-МАСШТАБИРОВАНИЕ ДЛЯ НЕТБУКА (1024x600) */
        @media screen and (max-width: 1024px) {
            html, body {
                transform: scale(0.8); 
                transform-origin: top left;
                width: 1280px;
                height: 720px;
            }
        }

        /* Визуальный контур уменьшенного плеера */
        .video-border {
            position: absolute;
            width: 1152px;  
            height: 648px;  
            left: 64px;     
            top: 36px;      
            border: 2px solid rgba(255, 255, 255, 0.3); 
            box-sizing: border-box;
            pointer-events: none;
            background: transparent !important; 
            z-index: 1;
        }

        /* Полупрозрачное меню слева */
        .menu-box {
            position: absolute;
            top: 50px;
            left: 80px;
            background: rgba(20, 20, 20, 0.92); 
            padding: 20px;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 10;
        }
        h1 { font-size: 22px; margin-top: 0; color: #ffaa00; }
        .info { font-size: 13px; color: #aaa; margin-bottom: 15px; line-height: 1.4; }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 12px 15px;
            background: #2a2a2a;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 16px;
        }
        li.active {
            background: #ffaa00;
            color: #000000;
            font-weight: bold;
        }

        /* Нижний статус-бар */
        #status-bar {
            position: absolute;
            bottom: 50px;
            left: 80px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }

        /* Графический индикатор громкости (Volume Bar) */
        #volume-bar-container {
            position: absolute;
            top: 50px;
            right: 80px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            opacity: 0; 
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        .volume-label {
            font-size: 16px;
            font-weight: bold;
            color: #ffaa00;
            margin-right: 15px;
            width: 75px;
        }
        .volume-track {
            width: 150px;
            height: 12px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
        }
        .volume-fill {
            width: 10%; 
            height: 100%;
            background: #ffaa00;
        }
    </style>
</head>
<body>

    <!-- Тонкая рамка-ориентир -->
    <div class="video-border"></div>

    <!-- Интерфейс портала -->
    <div class="menu-box">
        <h1>Legacy IPTV Плеер</h1>
        <div class="info">Навигация: Стрелки ↑ и ↓<br>Выбор: Enter / OK | Стоп: Backspace / EXIT<br>Громкость: Стрелки ← и →</div>
        
        <ul id="channelList">
            <!-- Каналы добавятся через JS -->
        </ul>
    </div>

    <!-- Статус бар -->
    <div id="status-bar">Статус: Готов к работе</div>

    <!-- Индикатор громкости -->
    <div id="volume-bar-container">
        <div class="volume-label" id="volumeText">ЗВУК: 10%</div>
        <div class="volume-track">
            <div class="volume-fill" id="volumeFill"></div>
        </div>
    </div>

    <script>
        // ИСПРАВЛЕННЫЙ СПИСОК ТЕСТОВЫХ АДРЕСОВ (Убрали m2v, добавили стабильные HD потоки)
        var channels = [
            { name: "Тестовый стрим Oracle", url: "http://138.3.253.85:8000/stream/74.ts" },
            { name: "Стрим: Мой Транскодер (HLS)", url: "https://ur5lgq-iptv-transcoder.hf.space/low.m3u8" },
            { name: "Тест HD: Tears of Steel (HLS)", url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" },
            { name: "Тест SD: BipBop (HLS Adaptive)", url: "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8" }
        ];

        var currentIndex = 0;
        var isStb = (typeof gSTB !== 'undefined');
        var volumeTimer = null;
        var currentVolume = 10; 

        window.onload = function() {
            if (isStb) {
                gSTB.InitPlayer();
                gSTB.SetAspect(0x10);       
                gSTB.SetVideoControl(1);   
                gSTB.SetVideoState(1);     
                gSTB.SetTopWin(0);         
                
                // ПРИНУДИТЕЛЬНОЕ ЗАТЯГИВАНИЕ ВИДЕО ПОД РАЗМЕР ОКНА (Убирает четверть экрана)
                if (typeof gSTB.SetDisplayMode === 'function') {
                    gSTB.SetDisplayMode(1); // 1 = Режим масштабирования "Fit" (растянуть под Viewport)
                }
                
                // Расчет аппаратных координат
                var screenWidth = window.innerWidth;
                if (screenWidth <= 1024) {
                    var w = Math.round(1152 * 0.8); 
                    var h = Math.round(648 * 0.8);  
                    var x = Math.round(64 * 0.8);   
                    var y = Math.round(36 * 0.8);   
                    gSTB.SetViewport(w, h, x, y); 
                } else {
                    gSTB.SetViewport(1152, 648, 64, 36); 
                }
                
                gSTB.SetVolume(currentVolume); 
            } else {
                showStatus("Запущено на ПК (gSTB эмуляция)");
            }

            renderList();
            updateSelection();
            updateVolumeUI(currentVolume);
        };

        window.stbEvent = {
            onEvent: function ( event ) {
                switch ( Number(event) ) {
                    case 2: showStatus("Статус: Получены аудио/видео дорожки."); break;
                    case 4: showStatus("Статус: Воспроизведение запущено"); break;
                    case 5: showStatus("Ошибка: Не удалось открыть поток"); break;
                }
            }
        };

        function renderList() {
            var html = "";
            channels.forEach(function(ch, idx) {
                html += '<li id="ch_' + idx + '">' + ch.name + '</li>';
            });
            document.getElementById("channelList").innerHTML = html;
        }

        function updateSelection() {
            channels.forEach(function(ch, idx) {
                var el = document.getElementById("ch_" + idx);
                if (el) el.className = (idx === currentIndex) ? "active" : "";
            });
        }

        function showStatus(text) {
            document.getElementById("status-bar").innerText = text;
        }

        function updateVolumeUI(vol) {
            document.getElementById("volumeText").innerText = "ЗВУК: " + vol + "%";
            document.getElementById("volumeFill").style.width = vol + "%";
            
            var container = document.getElementById("volume-bar-container");
            container.style.opacity = "1"; 
            
            clearTimeout(volumeTimer);
            volumeTimer = setTimeout(function() {
                container.style.opacity = "0";
            }, 2000);
        }

        window.addEventListener('keydown', function ( event ) {
            var keyCode = event.keyCode || event.which;

            if (isStb) {
                currentVolume = gSTB.GetVolume();
            }

            switch ( keyCode ) {
                case 38: 
                case 33: 
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateSelection();
                    }
                    event.preventDefault();
                    break;

                case 40: 
                case 34: 
                    if (currentIndex < channels.length - 1) {
                        currentIndex++;
                        updateSelection();
                    }
                    event.preventDefault();
                    break;

                case 13: 
                    showStatus("Запуск потока в gSTB...");
                    if (isStb) {
                        gSTB.Play('auto ' + channels[currentIndex].url);
                    } else {
                        showStatus("Эмуляция: Воспроизведение " + channels[currentIndex].name);
                    }
                    event.preventDefault();
                    break;

                case 39:  
                case 107: 
                case 187: 
                case 449: 
                    if (currentVolume < 100) {
                        currentVolume += 2;
                        if (currentVolume > 100) currentVolume = 100;
                        if (isStb) gSTB.SetVolume(currentVolume);
                        updateVolumeUI(currentVolume);
                    }
                    event.preventDefault();
                    break;

                case 37:  
                case 109: 
                case 189: 
                case 450: 
                    if (currentVolume > 0) {
                        currentVolume -= 2;
                        if (currentVolume < 0) currentVolume = 0;
                        if (isStb) gSTB.SetVolume(currentVolume);
                        updateVolumeUI(currentVolume);
                    }
                    event.preventDefault();
                    break;

                case 27: // ESC / EXIT
                case 8:  // Backspace (ПК) / BACK (MAG)
                    if (isStb) gSTB.Stop();
                    showStatus("Статус: Воспроизведение остановлено");
                    event.preventDefault();
                    break;
            }
        });
    </script>
</body>
