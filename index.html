<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MAG322 Hardware Reset Mode</title>
    <style>
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <script>
        var isStb = (typeof gSTB !== 'undefined');
        var streamUrl = 'http://138.3.253.85:8000/stream/74.ts';

        window.onload = function() {
            if (isStb) {
                // 1. Аппаратный сброс видеодекодера Broadcom
                if (typeof gSTB.SetMode === 'function') {
                    gSTB.SetMode(0); // Принудительный сброс видеорежима в стандарт оператора
                }
                
                gSTB.InitPlayer();
                
                // Пробуем жесткое аппаратное разделение слоев
                gSTB.SetVideoControl(0);   
                gSTB.SetVideoState(1);     
                gSTB.SetTopWin(0);
                
                // Принудительно выставляем 0x00 — режим "растянуть на весь экран без сохранения пропорций"
                gSTB.SetAspect(0x00); 
                
                // Включаем Full HD координаты. Если приставка выдает сигнал 1080p, 
                // старые координаты 1280x720 как раз занимали ровно треть экрана!
                gSTB.SetViewport(1920, 1080, 0, 0); 
                
                // Начальная громкость 15%
                gSTB.SetVolume(15); 
                
                // Запуск потока
                gSTB.Play('auto ' + streamUrl); 
            }
        };

        window.stbEvent = {
            onEvent: function ( event ) {
                if (Number(event) === 5 && isStb) {
                    gSTB.Play('auto ' + streamUrl); // Перезапуск при срыве
                }
            }
        };

        window.addEventListener('keydown', function ( event ) {
            var keyCode = event.keyCode || event.which;
            if (!isStb) return;

            var volume = gSTB.GetVolume();

            switch ( keyCode ) {
                case 13: // OK — ручной перезапуск
                    gSTB.Play('auto ' + streamUrl);
                    break;
                case 107: // Vol+
                case 449: 
                    volume += 5;
                    if (volume > 100) volume = 100;
                    gSTB.SetVolume(volume);
                    break;
                case 109: // Vol-
                case 450: 
                    volume -= 5;
                    if (volume < 0) volume = 0;
                    gSTB.SetVolume(volume);
                    break;
                case 8:  
                case 27: 
                    gSTB.Stop();
                    break;
            }
        });
    </script>
</body>
</html>
