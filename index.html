<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MAG322 Key Test</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#00ff00;
    font-family:monospace;
}

#title{
    padding:20px;
    font-size:36px;
    color:#fff;
}

#current{
    padding:20px;
    font-size:42px;
    color:#ffff00;
    border-bottom:2px solid #444;
}

#log{
    padding:20px;
    font-size:28px;
    overflow:auto;
    height:70%;
}
</style>
</head>

<body>

<div id="title">
MAG322 KEY TEST (JS API 344)
</div>

<div id="current">
Нажмите любую кнопку...
</div>

<div id="log"></div>

<script>

function addLog(text)
{
    var log=document.getElementById("log");

    var div=document.createElement("div");
    div.innerHTML=text;

    log.insertBefore(div,log.firstChild);

    while(log.children.length>30)
    {
        log.removeChild(log.lastChild);
    }
}

function showEvent(name,e)
{
    var txt=
        "EVENT="+name+
        " | keyCode="+e.keyCode+
        " | which="+e.which+
        " | charCode="+(e.charCode||0);

    document.getElementById("current").innerHTML=txt;

    addLog(txt);

    console.log(txt);
}

document.addEventListener(
    "keydown",
    function(e)
    {
        showEvent("keydown",e);
    },
    false
);

document.addEventListener(
    "keyup",
    function(e)
    {
        showEvent("keyup",e);
    },
    false
);

window.onload=function()
{
    addLog("Готов к тестированию пульта.");
    addLog("Проверьте:");
    addLog("PLAY");
    addLog("PAUSE");
    addLog("STOP");
    addLog("EXIT");
    addLog("BACK");
    addLog("MENU");
    addLog("VOL+");
    addLog("VOL-");
    addLog("MUTE");
    addLog("Красная/Зелёная/Жёлтая/Синяя");
};
</script>

</body>
</html>
