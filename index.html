<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MAG322 Core Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000000; color: #ffffff; font-family: monospace; overflow: hidden; }
        #log { position: absolute; top: 20px; left: 20px; font-size: 24px; background: rgba(0,0,0,0.8); z-index: 9999; width: 90%; word-wrap: break-word; }
    </style>
</head>
<body>

<!-- Экран логов, чтобы видеть статус запуска в реальном времени -->
<div id="log">Инициализация gSTB...<br></div>

<script type="text/javascript">
    function showLog(text) {
        document.getElementById('log').innerHTML += text + "<br>";
    }

    // Используем правильное решение ffrt2 для интернет-трансляций, как указано в мануале
    // Пробуем запустить ваш прямой поток транскодера Hugging Face
    var hlsUrl = "ffrt2 http://playertest.longtailvideo.com/adaptive/wowzaid3/playlist.m3u8";

    window.onload = function() {
        showLog("Страница загружена. Проверка объекта gSTB...");

        // Проверяем наличие нового API gSTB из вашей документации
        if (typeof gSTB === "undefined") {
            showLog("ОШИБКА: Объект gSTB не найден! Проверьте устройство.");
            return;
        }

        showLog("API gSTB успешно обнаружено.");
        
        try {
            // Настройка окна вывода видео на приставке
            gSTB.SetVideoWindow(0, 0, 1280, 720);
            gSTB.SetVideoControlMode(1);
            gSTB.SetTopWin(0);
            showLog("Параметры экрана установлены.");

            // Запуск воспроизведения через gSTB.Play с решением ffrt2
            showLog("Запуск потока: " + hlsUrl);
            gSTB.Play(hlsUrl);
            showLog("Сигнал на воспроизведение отправлен!");

            // Через 5 секунд скрываем логи, чтобы не мешали просмотру видео
            setTimeout(function() {
                document.getElementById('log').style.display = 'none';
            }, 5000);

        } catch (e) {
            showLog("Ошибка выполнения gSTB: " + e.message);
        }
    };

    // Обработка перезапуска при нажатии кнопок Назад/Выход
    document.addEventListener("keydown", function(event) {
        if (event.keyCode === 27 || event.keyCode === 8) { // Back / Exit
            try {
                gSTB.Stop();
                gSTB.Play(hlsUrl);
            } catch (err) {
                showLog("Ошибка перезапуска");
            }
        }
    }, false);
</script>
</body>
</html>
