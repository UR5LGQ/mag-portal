<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MAG322 Modern Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000000; color: #ffffff; font-family: monospace; overflow: hidden; }
        #log { position: absolute; top: 20px; left: 20px; font-size: 24px; background: rgba(0,0,0,0.8); z-index: 9999; width: 90%; word-wrap: break-word; }
        #vol_bar { position: absolute; bottom: 50px; left: 10%; width: 80%; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #fff; display: none; z-index: 10000; }
        #vol_val { height: 100%; background: #00ff00; width: 50%; }
    </style>
</head>
<body>

<div id="log">Инициализация stbPlayer...<br></div>
<div id="vol_bar"><div id="vol_val"></div></div>

<script type="text/javascript">
    function showLog(text) {
        document.getElementById('log').innerHTML += text + "<br>";
        document.getElementById('log').style.display = 'block';
    }

    var hlsUrl = "ffrt2 https://ur5lgq-iptv-transcoder.hf.space/low.m3u8";
    var currentVolume = 50;
    var volTimer = null;

    window.onload = function() {
        // Проверяем версию API ради интереса в логах
        try {
            if (typeof gSTB !== "undefined" && typeof gSTB.Version === "function") {
                showLog(gSTB.Version());
            }
        } catch(e){}

        // Запуск потока строго через stbPlayer, так как gSTB устарел
        try {
            if (typeof stbPlayer !== "undefined" && typeof stbPlayer.play === "function") {
                stbPlayer.play({url: hlsUrl});
                showLog("Поток запущен через stbPlayer.play");
                
                // Считываем начальную громкость из нового объекта
                if (typeof stbPlayer.volume !== "undefined") {
                    currentVolume = stbPlayer.volume;
                }
                
                hideLogDelayed();
            } else {
                showLog("ОШИБКА: Объект stbPlayer не найден!");
            }
        } catch (err) {
            showLog("Ошибка запуска: " + err.message);
        }
    };

    function hideLogDelayed() {
        setTimeout(function() {
            document.getElementById('log').style.display = 'none';
        }, 4000);
    }

    function changeVolume(dir) {
        if (dir === "up") {
            currentVolume += 5;
            if (currentVolume > 100) currentVolume = 100;
        } else {
            currentVolume -= 5;
            if (currentVolume < 0) currentVolume = 0;
        }

        // Меняем громкость через stbPlayer.volume
        try {
            if (typeof stbPlayer !== "undefined") {
                stbPlayer.volume = currentVolume;
            }
        } catch(e){
            showLog("Ошибка громкости: " + e.message);
        }

        document.getElementById('vol_val').style.width = currentVolume + "%";
        document.getElementById('vol_bar').style.display = "block";
        
        clearTimeout(volTimer);
        volTimer = setTimeout(function() {
            document.getElementById('vol_bar').style.display = "none";
        }, 2000);
    }

    // Слушаем нажатия клавиш (расширенный список кодов для MAG322 WebKit)
    document.addEventListener("keydown", function(event) {
        var keyCode = event.keyCode;
        var keyName = event.key; // Проверяем имя клавиши для Chromium

        // Отладочный лог: раскомментируйте строчку ниже, если захотите увидеть код любой нажатой кнопки прямо на ТВ
        // showLog("Нажата кнопка: Code=" + keyCode + " Name=" + keyName);

        // Обработка ГРОМКОСТИ (вверх)
        if (keyCode === 38 || keyCode === 449 || keyName === "VolumeUp" || keyCode === 175) {
            event.preventDefault();
            changeVolume("up");
        }
        
        // Обработка ГРОМКОСТИ (вниз)
        else if (keyCode === 40 || keyCode === 450 || keyName === "VolumeDown" || keyCode === 174) {
            event.preventDefault();
            changeVolume("down");
        }

        // Обработка СТОП
        else if (keyCode === 115 || keyName === "MediaStop" || keyCode === 178) {
            event.preventDefault();
            try { stbPlayer.stop(); showLog("Воспроизведение остановлено (stbPlayer.stop)"); } catch(e){}
        }

        // Обработка ПЛЕЙ (Возобновление)
        else if (keyCode === 114 || keyName === "MediaPlayPause" || keyCode === 179) {
            event.preventDefault();
            window.location.reload(); // Самый чистый перезапуск потока
        }

        // Обработка кнопки ВЫХОД / НАЗАД
        else if (keyCode === 8 || keyCode === 27 || keyName === "Escape" || keyName === "Backspace") {
            event.preventDefault();
            showLog("Выход в главное меню...");
            try {
                // Пытаемся корректно закрыть плеер и вызвать системное меню
                stbPlayer.stop();
                if (typeof gSTB !== "undefined" && typeof gSTB.LoadPage === "function") {
                    gSTB.LoadPage("file:///home/img/main_menu/index.html");
                } else {
                    window.location.href = "about:blank";
                }
            } catch(e) {
                window.location.reload();
            }
        }
    }, false);
</script>
</body>
</html>
