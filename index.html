<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MAG322 Fullscreen IPTV Playlist Portal</title>
    <style>
        /* Строжайшая прозрачность для MAG, чтобы сквозь интерфейс было видно видео на весь экран */
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 1920px; /* Фиксируем разрешение Full HD под работающий плеер */
            height: 1080px;
            overflow: hidden;
            position: relative;
        }
        
        /* На ПК включаем темную подложку для удобства отладки */
        @media screen and (min-width: 1921px) {
            html { background-color: #1a1a1a !important; }
        }

        /* АВТО-МАСШТАБИРОВАНИЕ ДЛЯ НЕТБУКА (1024x600) — сжимаем Full HD верстку */
        @media screen and (max-width: 1024px) {
            html, body {
                transform: scale(0.5333); /* 1024 / 1920 = ~0.5333 */
                transform-origin: top left;
                width: 1920px;
                height: 1080px;
            }
        }

        /* Полупрозрачное меню слева */
        .menu-box {
            position: absolute;
            top: 80px;
            left: 100px;
            background: rgba(20, 20, 20, 0.94); 
            padding: 30px;
            width: 500px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        h1 { font-size: 28px; margin-top: 0; color: #ffaa00; text-shadow: 1px 1px 2px #000; }
        .info { font-size: 15px; color: #aaa; margin-bottom: 20px; line-height: 1.5; }
        
        /* Контейнер списка с прокруткой */
        .list-container {
            max-height: 600px;
            overflow-y: hidden; /* Скрываем полосы прокрутки, управляем только кнопками пульта */
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 16px 20px;
            background: #252525;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid #333;
        }
        /* Стиль для выделенного стрелками канала */
        li.active {
            background: #ffaa00;
            color: #000000;
            font-weight: bold;
            border: 1px solid #ffffff;
            box-shadow: 0 0 10px rgba(255,170,0,0.5);
        }
        /* Стиль для канала, который играет прямо сейчас */
        li.playing {
            border-left: 8px solid #00ff00;
        }

        /* Нижний статус-бар */
        #status-bar {
            position: absolute;
            bottom: 80px;
            left: 100px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 30px;
            border-radius: 6px;
            font-size: 16px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Интерфейс портала -->
    <div class="menu-box" id="mainMenu">
        <h1>Мой IPTV Портал</h1>
        <div class="info">Навигация: Стрелки ↑ и ↓<br>Выбор канала: Enter / OK<br>Остановка: Backspace / EXIT<br>Громкость: Стрелки ← и →</div>
        
        <div class="list-container">
            <ul id="channelList">
                <li>Загрузка плейлиста...</li>
            </ul>
        </div>
    </div>

    <!-- Статус бар -->
    <div id="status-bar">Статус: Инициализация...</div>

    <script>
        // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ НА .M3U / .M3U8 ПЛЕЙЛИСТ
        // Сейчас по умолчанию прописан ваш рабочий тестовый канал в виде списка
        var playlistUrl = "https://ur5lgq-iptv-transcoder.hf.space/playlist.m3u"; 
        
        // Резервный список на случай, если интернет-ссылка не загрузится
        var channels = [
            { name: "Стрим: Мой Транскодер hf.space (HLS)", url: "https://ur5lgq-iptv-transcoder.hf.space/low.m3u8" }
        ];

    var currentIndex = 0;
    var playingIndex = -1;
    var isStb = (typeof gSTB !== 'undefined');
    var hideUiTimer = null;
    var hideStatusTimer = null; // Таймер для скрытия статус-бара
    var currentVolume = 55;
    var isPlaying = false;

    window.onload = function() {
        if (isStb) {
            if (typeof gSTB.SetMode === 'function') { gSTB.SetMode(0); }
            gSTB.InitPlayer();
            gSTB.SetVideoControl(1);
            gSTB.SetVideoState(1);
            gSTB.SetTopWin(0);
            gSTB.SetAspect(0x00);
            gSTB.SetViewport(1920, 1080, 0, 0);
            gSTB.SetVolume(currentVolume);

            if (typeof gSTB.SetHDMIAudioOut === 'function') { gSTB.SetHDMIAudioOut(1); }
            if (typeof gSTB.SetAudioOperationalMode === 'function') { gSTB.SetAudioOperationalMode(0); }

            // КРИТИЧЕСКИЕ НАСТРОЙКИ СТАБИЛИЗАЦИИ ПОТОКА
            if (typeof gSTB.SetBufferSize === 'function') {
                gSTB.SetBufferSize(4000, 10 * 1024 * 1024);
            }
            if (typeof gSTB.SetPlayerOption === 'function') {
                gSTB.SetPlayerOption("Keep-Alive", "1");
                gSTB.SetPlayerOption("http_persistent", "1");
            }
        } else {
            showStatus("Запущено на ПК (gSTB эмуляция)");
            showStatusWithTimer("Запущено на ПК (gSTB эмуляция)", 3000);
        }

        loadM3U(playlistUrl);
    };

    // Функция загрузки и парсинга плейлиста M3U
    function loadM3U(url) {
        showStatus("Загрузка плейлиста...");
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    parseM3U(xhr.responseText);
                } else {
                    showStatusWithTimer("Ошибка загрузки M3U. Резервный список.", 4000);
                    renderList();
                    checkAutoStart(); // Проверяем автостарт для резервного списка
                }
            }
        };
        try {
            xhr.send();
        } catch(e) {
            showStatusWithTimer("Ошибка сети CORS. Резервный список.", 4000);
            renderList();
            checkAutoStart(); // Проверяем автостарт для резервного списка
        }
    }

    // Парсер текстового формата M3U
    function parseM3U(text) {
        var lines = text.split("\n");
        var parsedChannels = [];
        var currentName = "";

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf("#EXTINF:") === 0) {
                var commaIdx = line.lastIndexOf(",");
                if (commaIdx !== -1) {
                    currentName = line.substring(commaIdx + 1).trim();
                } else {
                    currentName = "Без названия";
                }
            } else if (line.length > 0 && line.indexOf("#") !== 0) {
                if (currentName === "") currentName = "Канал " + (parsedChannels.length + 1);
                parsedChannels.push({ name: currentName, url: line });
                currentName = "";
            }
        }

        if (parsedChannels.length > 0) {
            channels = parsedChannels;
            showStatusWithTimer("Загружено каналов: " + channels.length, 3000);
        } else {
            showStatusWithTimer("Плейлист пуст. Загружен резервный канал.", 4000);
        }

        renderList();
        checkAutoStart(); // Запускаем проверку сохраненного канала сразу после парсинга плейлиста
    }

    // Новая функция: проверка памяти и автостарт
    function checkAutoStart() {
        try {
            var savedIndex = localStorage.getItem("lastChannelIndex");
            if (savedIndex !== null) {
                var idx = parseInt(savedIndex, 10);
                // Проверяем, что индекс корректный и канал существует в текущем плейлисте
                if (!isNaN(idx) && idx >= 0 && idx < channels.length) {
                    currentIndex = idx;
                    updateSelection();
                    playCurrentChannel();
                    return;
                }
            }
        } catch (e) {
            // На случай, если localStorage заблокирован или не поддерживается
        }
        // Если памяти нет, просто подсвечиваем первый канал без автозапуска
        updateSelection();
    }

    // Обновленная модель обработки событий с "умным автореконнектом"
    window.stbEvent = {
        onEvent: function ( event ) {
            if (!isStb) return;
            switch ( Number(event) ) {
                case 2:
                    try {
                        var audioTracks = gSTB.GetAudioPIDs();
                        if (audioTracks && audioTracks.length > 0) {
                            var firstTrack = audioTracks;
                            var pid = (typeof firstTrack === 'object') ? firstTrack.pid : firstTrack;
                            gSTB.SetAudioPID(Number(pid));
                        }
                    } catch (e) {}
                    break;
                case 4:
                    isPlaying = true;
                    showStatusWithTimer("Воспроизведение запущено", 2000);
                    break;
                case 5:
                    showStatus("Сбой сети. Восстановление...");
                    gSTB.Stop();
                    setTimeout(function() {
                        if (playingIndex !== -1) {
                            gSTB.Play('auto ' + channels[playingIndex].url);
                        }
                    }, 1500);
                    break;
            }
        }
    };

    function renderList() {
        var html = "";
        channels.forEach(function(ch, idx) {
            html += '<li id="ch_' + idx + '">' + ch.name + '</li>';
        });
        document.getElementById("channelList").innerHTML = html;
    }

    function updateSelection() {
        channels.forEach(function(ch, idx) {
            var el = document.getElementById("ch_" + idx);
            if (!el) return;
            var className = "";
            if (idx === currentIndex) className += " active";
            if (idx === playingIndex) className += " playing";
            el.className = className;
        });

        var activeEl = document.getElementById("ch_" + currentIndex);
        if (activeEl) {
            activeEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
    }

    function showStatus(text) {
        var statusBar = document.getElementById("status-bar");
        statusBar.innerText = text;
        statusBar.style.display = "block";
    }

    // Функция вывода инфо-бара на несколько секунд
    function showStatusWithTimer(text, delay) {
        clearTimeout(hideStatusTimer);
        showStatus(text);
        hideStatusTimer = setTimeout(function() {
            var menu = document.getElementById("mainMenu");
            if (menu.style.display === "none") {
                document.getElementById("status-bar").style.display = "none";
            }
        }, delay || 3000);
    }

    // Функция принудительного включения/выключения основного меню плейлиста
    function toggleMenu(show) {
        var menu = document.getElementById("mainMenu");
        var statusBar = document.getElementById("status-bar");
        
        if (show) {
            menu.style.display = "block";
            statusBar.style.display = "block";
            clearTimeout(hideStatusTimer);
        } else {
            menu.style.display = "none";
            statusBar.style.display = "none";
        }
    }

    // Функция для непосредственного запуска выбранного канала + сохранение в память
    function playCurrentChannel() {
        playingIndex = currentIndex;
        updateSelection();
        showStatusWithTimer("Запуск: " + channels[currentIndex].name, 3000);
        
        // Сохраняем индекс канала в постоянную память приставки
        try {
            localStorage.setItem("lastChannelIndex", currentIndex);
        } catch (e) {}
        
        if (isStb) {
            gSTB.Play('auto ' + channels[currentIndex].url);
        } else {
            isPlaying = true;
        }
    }

    window.addEventListener('keydown', function ( event ) {
        var keyCode = event.keyCode || event.which;
        if (isStb) { currentVolume = gSTB.GetVolume(); }

        var menu = document.getElementById("mainMenu");
        var isMenuVisible = (menu.style.display === "block" || menu.style.display === "");

        switch ( keyCode ) {
            case 38: // Стрелка ВВЕРХ
                if (isMenuVisible) {
                    if (currentIndex > 0) { 
                        currentIndex--; 
                    } else {
                        currentIndex = channels.length - 1; 
                    }
                    updateSelection(); 
                } else {
                    if (currentIndex < channels.length - 1) { 
                        currentIndex++; 
                    } else {
                        currentIndex = 0; 
                    }
                    updateSelection();
                    playCurrentChannel();
                    menu.style.display = "none";
                }
                event.preventDefault();
                break;

            case 40: // Стрелка ВНИЗ
                if (isMenuVisible) {
                    if (currentIndex < channels.length - 1) { 
                        currentIndex++; 
                    } else {
                        currentIndex = 0; 
                    }
                    updateSelection();
                } else {
                    if (currentIndex > 0) { 
                        currentIndex--; 
                    } else {
                        currentIndex = channels.length - 1; 
                    }
                    updateSelection();
                    playCurrentChannel();
                    menu.style.display = "none";
                }
                event.preventDefault();
                break;

            case 13: // OK / Enter
                if (isMenuVisible) {
                    playCurrentChannel();
                    setTimeout(function() {
                        toggleMenu(false);
                    }, 1000);
                } else {
                    if (playingIndex !== -1) {
                        showStatusWithTimer("Канал: " + channels[playingIndex].name, 3000);
                    }
                }
                event.preventDefault();
                break;

            case 122: // Код кнопки MENU
            case 82:  // KEY_MENU
                if (isMenuVisible) {
                    toggleMenu(false);
                } else {
                    if (playingIndex !== -1) {
                        currentIndex = playingIndex;
                    }
                    toggleMenu(true);
                    updateSelection();
                }
                event.preventDefault();
                break;

            case 39: // ВПРАВО (Громкость +)
            case 107:
            case 449:
                if (currentVolume < 100) {
                    currentVolume += 5;
                    if (currentVolume > 100) currentVolume = 100;
                    if (isStb) gSTB.SetVolume(currentVolume);
                    showStatusWithTimer("Громкость: " + currentVolume + "%", 2000);
                }
                event.preventDefault();
                break;

            case 37: // ВЛЕВО (Громкость -)
            case 109:
            case 450:
                if (currentVolume > 0) {
                    currentVolume -= 5;
                    if (currentVolume < 0) currentVolume = 0;
                    if (isStb) gSTB.SetVolume(currentVolume);
                    showStatusWithTimer("Громкость: " + currentVolume + "%", 2000);
                }
                event.preventDefault();
                break;

            case 8: // Backspace / BACK
            case 27: // ESC / EXIT
                if (isMenuVisible) {
                    toggleMenu(false);
                } else {
                    if (isStb) gSTB.Stop();
                    isPlaying = false;
                    playingIndex = -1;
                    showStatusWithTimer("Статус: остановлено", 3000);
                    try { localStorage.removeItem("lastChannelIndex"); } catch(e) {}
                    updateSelection();
                }
                event.preventDefault();
                break;
        }
    });
</script>
</body>
</html>
