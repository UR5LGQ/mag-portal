<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MAG322 Auto Player Fix</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    </style>
</head>
<body>
<script type="text/javascript">
    // Пробуем запустить поток напрямую через системный gstreamer без ffmpeg,
    // так как он лучше переваривает внешние ссылки на MAG322
    var hlsUrl = "https://ur5lgq-iptv-transcoder.hf.space/low.m3u8"; 

    window.onload = function() {
        setTimeout(startPlayback, 1000); // Даем приставке 1 секунду на инициализацию системных библиотек
    };

    function startPlayback() {
        try {
            stb.InitPlayer();
            stb.SetVideoWindow(0, 0, 1280, 720);
            stb.SetVideoControlMode(1);
            stb.SetTopWin(0);

            // Запускаем поток
            stb.Play(hlsUrl);
        } catch (e) {
            // Если упало, пробуем альтернативный вариант с ffmpeg по http
            try {
                stb.Play("ffmpeg " + hlsUrl);
            } catch (err) {
                console.log("STB Player Crash");
            }
        }
    }

    // Защита кнопок
    document.addEventListener("keydown", function(event) {
        if (event.keyCode === 27 || event.keyCode === 8) {
            stb.Stop();
            startPlayback();
        }
    }, false);
</script>
</body>
</html>
