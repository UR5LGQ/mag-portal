<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MAG322 Fullscreen Player Fixed Audio</title>
    <style>
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <script>
        var isStb = (typeof gSTB !== 'undefined');
        var streamUrl = 'http://138.3.253.85:8000/stream/74.ts';

        window.onload = function() {
            if (isStb) {
                // Аппаратный сброс видеодекодера Broadcom
                if (typeof gSTB.SetMode === 'function') {
                    gSTB.SetMode(0); 
                }
                
                gSTB.InitPlayer();
                
                // Аппаратное разделение слоев
                gSTB.SetVideoControl(0);   
                gSTB.SetVideoState(1);     
                gSTB.SetTopWin(0);
                
                // Режим "растянуть на весь экран"
                gSTB.SetAspect(0x00); 
                
                // Проверенные Full HD координаты
                gSTB.SetViewport(1920, 1080, 0, 0); 
                
                // Установка громкости на 35%
                gSTB.SetVolume(35); 
                
                // КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ ЗВУКА:
                // 1 = Режим PCM (Стерео) для HDMI. Заставляет приставку самостоятельно 
                // декодировать аудиопоток и отдавать на ТВ уже чистый звук.
                if (typeof gSTB.SetHDMIAudioOut === 'function') {
                    gSTB.SetHDMIAudioOut(1); 
                }
                
                // Перевод аудиосистемы в стандартный операционный режим
                if (typeof gSTB.SetAudioOperationalMode === 'function') {
                    gSTB.SetAudioOperationalMode(0); 
                }
                
                // Запуск потока
                gSTB.Play('auto ' + streamUrl); 
            }
        };

        window.stbEvent = {
            onEvent: function ( event ) {
                if (Number(event) === 5 && isStb) {
                    gSTB.Play('auto ' + streamUrl); // Перезапуск при срыве
                }
            }
        };

        window.addEventListener('keydown', function ( event ) {
            var keyCode = event.keyCode || event.which;
            if (!isStb) return;

            var volume = gSTB.GetVolume();

            switch ( keyCode ) {
                case 13: // OK — ручной перезапуск
                    gSTB.Play('auto ' + streamUrl);
                    break;
                case 107: // Vol+
                case 449: 
                    volume += 5;
                    if (volume > 100) volume = 100;
                    gSTB.SetVolume(volume);
                    break;
                case 109: // Vol-
                case 450: 
                    volume -= 5;
                    if (volume < 0) volume = 0;
                    gSTB.SetVolume(volume);
                    break;
                case 8:  
                case 27: 
                    gSTB.Stop();
                    break;
            }
        });
    </script>
</body>
</html>
