<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MAG322 Core Player Fix</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000000; color: #ffffff; font-family: monospace; overflow: hidden; }
        #log { position: absolute; top: 20px; left: 20px; font-size: 24px; background: rgba(0,0,0,0.8); z-index: 9999; width: 90%; word-wrap: break-word; }
    </style>
</head>
<body>

<div id="log">Инициализация gSTB...<br></div>

<script type="text/javascript">
    function showLog(text) {
        document.getElementById('log').innerHTML += text + "<br>";
    }

    // Ссылка на ваш поток с решением ffrt2 для realtime HTTP трансляций
    var hlsUrl = "ffrt2 https://ur5lgq-iptv-transcoder.hf.space/low.m3u8";

    window.onload = function() {
        showLog("Страница загружена. Проверка gSTB...");

        if (typeof gSTB === "undefined") {
            showLog("ОШИБКА: Объект gSTB не найден.");
            return;
        }

        showLog("gSTB найден. Пробуем запустить поток...");
        
        // Попытка №1: Прямой вызов gSTB.Play
        try {
            if (typeof gSTB.Play === "function") {
                showLog("Вызов gSTB.Play...");
                gSTB.Play(hlsUrl);
                showLog("Команда gSTB.Play отправлена успешно!");
                hideLogDelayed();
                return;
            }
        } catch (e1) {
            showLog("Сбой gSTB.Play: " + e1.message);
        }

        // Попытка №2: Альтернативный вызов через stbPlayer.play (если первый метод не сработал)
        try {
            if (typeof stbPlayer !== "undefined" && typeof stbPlayer.play === "function") {
                showLog("Вызов stbPlayer.play...");
                stbPlayer.play({url: hlsUrl});
                showLog("Команда stbPlayer.play отправлена успешно!");
                hideLogDelayed();
                return;
            } else {
                showLog("Объект stbPlayer не обнаружен.");
            }
        } catch (e2) {
            showLog("Сбой stbPlayer.play: " + e2.message);
        }

        showLog("ОШИБКА: Не удалось найти рабочий метод воспроизведения.");
    };

    function hideLogDelayed() {
        setTimeout(function() {
            document.getElementById('log').style.display = 'none';
        }, 5000);
    }

    // Перезапуск по кнопкам Назад/Выход
    document.addEventListener("keydown", function(event) {
        if (event.keyCode === 27 || event.keyCode === 8) {
            try { gSTB.Stop(); } catch(e){}
            try { stbPlayer.stop(); } catch(e){}
            window.location.reload(); // Самый надежный способ перезапустить плеер — обновить страницу портала
        }
    }, false);
</script>
</body>
</html>
