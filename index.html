<!DOCTYPE html>
<html>
<body style="background:black;color:white;font-size:24px">

<pre id="out"></pre>

<script>

function p(t){
document.getElementById('out').innerHTML+=t+"\n";
}

window.onload=function(){

p("gSTB = "+typeof gSTB);
p("stb = "+typeof stb);

if(typeof gSTB!="undefined")
{
for(var k in gSTB)
{
p("gSTB."+k);
}
}

if(typeof stb!="undefined")
{
for(var k in stb)
{
p("stb."+k);
}
}

};

</script>

</body>
</html>
