<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MAG322 Perfect Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000000; color: #ffffff; font-family: monospace; overflow: hidden; }
        #log { position: absolute; top: 20px; left: 20px; font-size: 24px; background: rgba(0,0,0,0.8); z-index: 9999; width: 90%; word-wrap: break-word; }
        #vol_bar { position: absolute; bottom: 50px; left: 10%; width: 80%; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #fff; display: none; z-index: 10000; }
        #vol_val { height: 100%; background: #00ff00; width: 50%; }
    </style>
</head>
<body>

<div id="log">Запуск видео и пульта...<br></div>
<div id="vol_bar"><div id="vol_val"></div></div>

<script type="text/javascript">
    function showLog(text) {
        document.getElementById('log').innerHTML += text + "<br>";
        document.getElementById('log').style.display = 'block';
    }

    var hlsUrl = "ffrt2 https://ur5lgq-iptv-transcoder.hf.space/low.m3u8";
    var currentVolume = 50;
    var volTimer = null;

    window.onload = function() {
        try {
            if (typeof stbPlayer !== "undefined" && typeof stbPlayer.play === "function") {
                
                // Параметры буферизации для стабильного воспроизведения без рывков
                var playOptions = {
                    url: hlsUrl,
                    bufferStart: 4000, 
                    bufferTime: 8000,  
                    lowBufferTime: 2000 
                };

                stbPlayer.play(playOptions);
                showLog("Поток запущен.");
                
                if (typeof stbPlayer.volume !== "undefined") {
                    currentVolume = stbPlayer.volume;
                }
                
                hideLogDelayed();
            } else {
                showLog("Ошибка: объект stbPlayer не найден.");
            }
        } catch (err) {
            showLog("Ошибка stbPlayer.play: " + err.message);
        }
    };

    function hideLogDelayed() {
        setTimeout(function() {
            document.getElementById('log').style.display = 'none';
        }, 3000);
    }

    function changeVolume(dir) {
        if (dir === "up") {
            currentVolume += 5;
            if (currentVolume > 100) currentVolume = 100;
        } else {
            currentVolume -= 5;
            if (currentVolume < 0) currentVolume = 0;
        }
        try { if (typeof stbPlayer !== "undefined") { stbPlayer.volume = currentVolume; } } catch(e){}
        
        document.getElementById('vol_val').style.width = currentVolume + "%";
        document.getElementById('vol_bar').style.display = "block";
        clearTimeout(volTimer);
        volTimer = setTimeout(function() { document.getElementById('vol_bar').style.display = "none"; }, 2000);
    }

    // Точный перехват кнопок по вашей таблице спецификации MAG322
    document.addEventListener("keydown", function(event) {
        var code = event.keyCode;
        var alt = event.altKey;

        // Блокируем стандартные действия Chromium, чтобы приставка не выходила в браузерную строку
        event.preventDefault();

        // 1. Громкость вверх (код 107)
        if (code === 107 || code === 38) {
            changeVolume("up");
        } 
        // 2. Громкость вниз (код 109)
        else if (code === 109 || code === 40) {
            changeVolume("down");
        } 
        // 3. Стоп (код 83 + Alt)
        else if (code === 83 && alt) {
            try { 
                stbPlayer.stop(); 
                showLog("Воспроизведение остановлено."); 
            } catch(e){}
        } 
        // 4. Плей / Пауза (код 82 + Alt)
        else if (code === 82 && alt) {
            window.location.reload(); // Перезапуск страницы для возобновления
        } 
        // 5. Mute / Без звука (код 192 + Alt)
        else if (code === 192 && alt) {
            try { stbPlayer.mute = !stbPlayer.mute; } catch(e){}
        } 
        // 6. Выход / Назад (коды 27 или 8)
        else if (code === 27 || code === 8) {
            try {
                stbPlayer.stop();
                if (typeof gSTB !== "undefined" && typeof gSTB.LoadPage === "function") {
                    gSTB.LoadPage("file:///home/img/main_menu/index.html"); // Выход в меню приставки
                } else {
                    window.location.href = "about:blank";
                }
            } catch(e) {
                window.location.reload();
            }
        }
    }, false);
</script>
</body>
</html>
