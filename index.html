<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MAG322 Legacy Portal</title>
    <style>
        /* Делаем прозрачный фон, чтобы видео было видно под интерфейсом */
        body {
            background-color: transparent; 
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            overflow: hidden;
        }
        .menu-box {
            background: rgba(20, 20, 20, 0.85); /* Полупрозрачная плашка меню */
            padding: 20px;
            width: 400px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        h1 { font-size: 22px; margin-top: 0; color: #ffaa00; }
        .info { font-size: 14px; color: #aaa; margin-bottom: 15px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 12px 15px;
            background: #2a2a2a;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 16px;
        }
        /* Подсветка активного канала кнопками ВВЕРХ/ВНИЗ */
        li.active {
            background: #ffaa00;
            color: #000000;
            font-weight: bold;
        }
        /* Статус-бар внизу экрана */
        #status-bar {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="menu-box">
        <h1>Legacy IPTV Портал</h1>
        <div class="info">Навигация: CH+ / CH- (или Стрелки)<br>Выбор: OK | Стоп: EXIT<br>Громкость: Vol+ / Vol-</div>
        
        <ul id="channelList">
            <!-- Каналы добавятся через JS -->
        </ul>
    </div>

    <div id="status-bar">Статус: Готов к работе</div>

    <script>
        // Тестовый список каналов
        var channels = [
            { name: "Тестовое видео (M2V)", url: "http://www.mediacollege.com/downloads/video/timecode/tc_25fps_20mins.m2v" },
            { name: "Тестовый стрим (HLS)", url: "http://138.3.253.85:8000/stream/74.ts" }
        ];

        var currentIndex = 0;
        var isStb = (typeof gSTB !== 'undefined');

        // 1. Инициализация плеера (Раздел Playback preparations из вашего туториала)
        window.onload = function() {
            if (isStb) {
                gSTB.InitPlayer();
                gSTB.SetAspect(0x10);       // Формат экрана (16:9)
                gSTB.SetVideoControl(1);   // Включаем вывод видео (1 — видео под HTML слоем)
                gSTB.SetVideoState(1);     // Включаем видеодекодер
                gSTB.SetTopWin(0);         // Приоритет окон графики
                gSTB.SetViewport(1280, 720, 0, 0); // Видео на весь экран HD
            } else {
                showStatus("Запущено в обычном браузере (gSTB недоступен)");
            }

            renderList();
            updateSelection();
        };

        // 2. Инициализация модели событий (Раздел Event model из туториала)
        window.stbEvent = {
            onEvent: function ( event ) {
                switch ( Number(event) ) {
                    case 1:
                        showStatus("Статус: Нажмите OK для загрузки...");
                        break;
                    case 2:
                        showStatus("Статус: Получена информация о дорожках.");
                        console.log('Information on audio and video tracks received.');
                        break;
                    case 4:
                        showStatus("Статус: Воспроизведение началось");
                        console.log('Video playback has begun.');
                        break;
                    case 5:
                        showStatus("Ошибка: Не удалось открыть поток");
                        break;
                }
            }
        };

        function renderList() {
            var html = "";
            channels.forEach(function(ch, idx) {
                html += '<li id="ch_' + idx + '">' + ch.name + '</li>';
            });
            document.getElementById("channelList").innerHTML = html;
        }

        function updateSelection() {
            channels.forEach(function(ch, idx) {
                var el = document.getElementById("ch_" + idx);
                if (el) el.className = (idx === currentIndex) ? "active" : "";
            });
        }

        function showStatus(text) {
            document.getElementById("status-bar").innerText = text;
        }

        // 3. Управление плеером и события ввода (Раздел Player manipulations из туториала)
        window.addEventListener('keydown', function ( event ) {
            var keyCode = event.keyCode || event.which;
            
            if (isStb) {
                var volume = gSTB.GetVolume();
            }

            switch ( keyCode ) {
                case 38: // Стрелка ВВЕРХ
                case 33: // Кнопка PageUp / CH+ на некоторых пультах MAG
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateSelection();
                    }
                    event.preventDefault();
                    break;

                case 40: // Стрелка ВНИЗ
                case 34: // Кнопка PageDown / CH-
                    if (currentIndex < channels.length - 1) {
                        currentIndex++;
                        updateSelection();
                    }
                    event.preventDefault();
                    break;

                case 13: // Кнопка OK — Запуск видео (Раздел Play video)
                    showStatus("Статус: Подключение...");
                    var targetUrl = channels[currentIndex].url;
                    
                    if (isStb) {
                        // Используем точную конструкцию склейки решения auto и ссылки
                        gSTB.Play('auto ' + targetUrl);
                    } else {
                        showStatus("Эмуляция: Играет " + channels[currentIndex].name);
                    }
                    event.preventDefault();
                    break;

                case 107: // Кнопка Громкость ВВЕРХ (Vol +)
                case 449: // Системный код громкости на некоторых прошивках MAG
                    if (isStb && volume < 100) {
                        volume++;
                        gSTB.SetVolume(volume);
                        showStatus("Громкость: " + volume + "%");
                    }
                    break;

                case 109: // Кнопка Громкость ВНИЗ (Vol -)
                case 450: // Системный код громкости минус
                    if (isStb && volume > 0) {
                        volume--;
                        gSTB.SetVolume(volume);
                        showStatus("Громкость: " + volume + "%");
                    }
                    break;

                case 27: // Кнопка EXIT / ESC
                case 8:  // Кнопка BACK
                    if (isStb) {
                        gSTB.Stop();
                    }
                    showStatus("Статус: Воспроизведение остановлено");
                    event.preventDefault();
                    break;
            }
        });
    </script>
</body>
</html>
