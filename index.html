<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MAG322 Auto Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    </style>
</head>
<body>
<script type="text/javascript">
    window.onload = function() {
        try {
            // Инициализация плеера MAG
            stb.InitPlayer();
            stb.SetVideoWindow(0, 0, 1280, 720);
            stb.SetVideoControlMode(1);
            stb.SetTopWin(0);

            // ВАЖНО: Замените URL ниже на вашу рабочую ссылку .m3u8
            var streamUrl = "ffmpeg https://ur5lgq-iptv-transcoder.hf.space/low.m3u8";

            stb.Play(streamUrl);
        } catch (e) {
            console.log("STB Error: " + e.message);
        }
    };

    // Перезапуск при случайном нажатии кнопок Назад/Выход
    document.addEventListener("keydown", function(event) {
        if (event.keyCode === 27 || event.keyCode === 8) {
            stb.Stop();
            stb.Play("ffmpeg https://ur5lgq-iptv-transcoder.hf.space/low.m3u8"); // Тут тоже замените ссылку
        }
    }, false);
</script>
</body>
</html>
