<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MAG322 Fullscreen Player Audio Auto Fix</title>
    <style>
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <script>
        var isStb = (typeof gSTB !== 'undefined');
        var streamUrl = 'http://138.3.253.85:8000/stream/74.ts';

        window.onload = function() {
            if (isStb) {
                // Аппаратный сброс видеодекодера Broadcom
                if (typeof gSTB.SetMode === 'function') {
                    gSTB.SetMode(0); 
                }
                
                gSTB.InitPlayer();
                
                // Аппаратное разделение слоев
                gSTB.SetVideoControl(0);   
                gSTB.SetVideoState(1);     
                gSTB.SetTopWin(0);
                
                // Режим "растянуть на весь экран"
                gSTB.SetAspect(0x00); 
                
                // Проверенные Full HD координаты
                gSTB.SetViewport(1920, 1080, 0, 0); 
                
                // Установка громкости на 65%
                gSTB.SetVolume(65); 
                
                // Стандартный аудио-режим PCM (Стерео) для HDMI
                if (typeof gSTB.SetHDMIAudioOut === 'function') {
                    gSTB.SetHDMIAudioOut(1); 
                }
                if (typeof gSTB.SetAudioOperationalMode === 'function') {
                    gSTB.SetAudioOperationalMode(0); 
                }
                
                // Запуск потока
                gSTB.Play('auto ' + streamUrl); 
            }
        };

        // КРИТИЧЕСКИЙ БЛОК: Модель обработки событий плеера с авто-включением звука
        window.stbEvent = {
            onEvent: function ( event ) {
                if (!isStb) return;

                switch ( Number(event) ) {
                    case 2:
                        console.log('Information on audio and video tracks received.');
                        try {
                            // Получаем список всех аудиодорожек, найденных в потоке .ts
                            var audioTracks = gSTB.GetAudioPIDs(); 
                            
                            // Если дорожки найдены, принудительно берем самую первую рабочую
                            if (audioTracks && audioTracks.length > 0) {
                                // Некоторые прошивки возвращают JSON-строку, некоторые — массив объектов
                                var firstTrack = audioTracks[0];
                                var pid = (typeof firstTrack === 'object') ? firstTrack.pid : firstTrack;
                                
                                // Активируем звуковую дорожку на чипсете Broadcom
                                gSTB.SetAudioPID(Number(pid));
                                console.log('Successfully forced audio PID: ' + pid);
                            }
                        } catch (e) {
                            console.log('Error parsing audio tracks: ' + e.message);
                        }
                        break;

                    case 4:
                        console.log('Playback started.');
                        break;

                    case 5:
                        gSTB.Play('auto ' + streamUrl); // Перезапуск при срыве
                        break;
                }
            }
        };

        window.addEventListener('keydown', function ( event ) {
            var keyCode = event.keyCode || event.which;
            if (!isStb) return;

            var volume = gSTB.GetVolume();

            switch ( keyCode ) {
                case 13: // OK — ручной перезапуск
                    gSTB.Play('auto ' + streamUrl);
                    break;
                case 107: // Vol+
                case 449: 
                    volume += 5;
                    if (volume > 100) volume = 100;
                    gSTB.SetVolume(volume);
                    break;
                case 109: // Vol-
                case 450: 
                    volume -= 5;
                    if (volume < 0) volume = 0;
                    gSTB.SetVolume(volume);
                    break;
                case 8:  
                case 27: 
                    gSTB.Stop();
                    break;
            }
        });
    </script>
</body>
</html>
