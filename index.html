<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MAG322 Core Functional Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000000; color: #ffffff; font-family: monospace; overflow: hidden; }
        #log { position: absolute; top: 20px; left: 20px; font-size: 24px; background: rgba(0,0,0,0.8); z-index: 9999; width: 90%; word-wrap: break-word; }
        #vol_bar { position: absolute; bottom: 50px; left: 10%; width: 80%; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #fff; display: none; z-index: 10000; }
        #vol_val { height: 100%; background: #00ff00; width: 50%; }
    </style>
</head>
<body>

<div id="log">Запуск видеопотока gSTB...<br></div>
<div id="vol_bar"><div id="vol_val"></div></div>

<script type="text/javascript">
    function showLog(text) {
        document.getElementById('log').innerHTML += text + "<br>";
        document.getElementById('log').style.display = 'block';
    }

    var hlsUrl = "ffrt2 https://ur5lgq-iptv-transcoder.hf.space/low.m3u8";
    var currentVolume = 20;
    var volTimer = null;

    window.onload = function() {
        if (typeof gSTB === "undefined") {
            showLog("ОШИБКА: Объект gSTB не найден.");
            return;
        }

        try {
            gSTB.Play(hlsUrl);
            showLog("Поток запущен успешно!");
            hideLogDelayed();
        } catch (err) {
            showLog("Ошибка gSTB.Play: " + err.message);
        }
    };

    function hideLogDelayed() {
        setTimeout(function() {
            document.getElementById('log').style.display = 'none';
        }, 3000);
    }

    function changeVolume(dir) {
        if (dir === "up") {
            currentVolume += 5;
            if (currentVolume > 100) currentVolume = 100;
        } else {
            currentVolume -= 5;
            if (currentVolume < 0) currentVolume = 0;
        }

        // Альтернативный перебор методов регулировки звука для MAG322
        try {
            if (typeof gSTB.SetVolume === "function") {
                gSTB.SetVolume(currentVolume);
            } else if (typeof window.stbPlayer !== "undefined") {
                window.stbPlayer.volume = currentVolume;
            }
        } catch(e){}

        document.getElementById('vol_val').style.width = currentVolume + "%";
        document.getElementById('vol_bar').style.display = "block";
        
        clearTimeout(volTimer);
        volTimer = setTimeout(function() {
            document.getElementById('vol_bar').style.display = "none";
        }, 2000);
    }

    document.addEventListener("keydown", function(event) {
        var code = event.keyCode;
        var alt = event.altKey;

        // Обработка СТОП (код 83 + Alt)
        if (code === 83 && alt) {
            event.preventDefault();
            try { gSTB.Stop(); showLog("Трансляция остановлена кнопкой СТОП."); } catch(e){}
        } 
        // Обработка ПЛЕЙ (код 82 + Alt)
        else if (code === 82 && alt) {
            event.preventDefault();
            window.location.reload(); 
        } 
        // Обработка ГРОМКОСТИ ВВЕРХ (код 107 или стрелка 38)
        else if (code === 107 || code === 38) {
            // Убираем preventDefault для громкости, чтобы ОС приставки тоже видела нажатие
            changeVolume("up");
        } 
        // Обработка ГРОМКОСТИ ВНИЗ (код 109 или стрелка 40)
        else if (code === 109 || code === 40) {
            changeVolume("down");
        } 
        // Обработка кнопки MUTE (код 192 + Alt)
        else if (code === 192 && alt) {
            event.preventDefault();
            try { gSTB.SetMute(!gSTB.GetMute()); } catch(e){}
        }
        // Обработка ВЫХОД / НАЗАД (коды 27 или 8)
        else if (code === 27 || code === 8) {
            // НЕ блокируем дефолтное действие браузера (убираем event.preventDefault())
            try { gSTB.Stop(); } catch(e){}
            
            // Самый надежный способ заставить Chromium на MAG322 выйти во внутренний портал:
            // отправляем приставку на несуществующую пустую локальную страницу
            window.location.href = "about:blank"; 
        }
    }, false);
</script>
</body>
</html>
