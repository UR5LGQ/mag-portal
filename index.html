<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MAG322 HLS Portal</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#info{
    position:absolute;
    top:20px;
    left:20px;
    z-index:9999;
    color:#fff;
    background:rgba(0,0,0,0.75);
    padding:10px 15px;
    font-family:Arial,sans-serif;
    font-size:22px;
    border-radius:4px;
    display:none;
}
</style>
</head>

<body>

<div id="info"></div>

<script>

var STREAM_URL =
"ffrt2 https://ur5lgq-iptv-transcoder.hf.space/low.m3u8";

var paused = false;
var muted = false;
var volume = 50;

function showInfo(text)
{
    var el = document.getElementById("info");

    el.innerHTML = text;
    el.style.display = "block";

    clearTimeout(window.infoTimer);

    window.infoTimer = setTimeout(function(){
        el.style.display = "none";
    },2000);
}

function setViewport70()
{
    try
    {
        gSTB.SetVideoControl(1);

        gSTB.SetViewport(
            1344, // width
            756,  // height
            288,  // x
            162   // y
        );

        gSTB.SetVideoState(1);

        showInfo("70% VIEW");
    }
    catch(e)
    {
        showInfo("Viewport Error");
    }
}

function setFullscreen()
{
    try
    {
        gSTB.SetVideoControl(1);

        gSTB.SetViewport(
            1920,
            1080,
            0,
            0
        );

        gSTB.SetVideoState(1);

        showInfo("FULLSCREEN");
    }
    catch(e)
    {
        showInfo("Fullscreen Error");
    }
}

function startPlayback()
{
    try
    {
        gSTB.Play(STREAM_URL);

        setTimeout(function(){
            setViewport70();
        },1000);

        paused = false;

        showInfo("PLAY");
    }
    catch(e)
    {
        showInfo("PLAY ERROR");
    }
}

function stopPlayback()
{
    try
    {
        gSTB.Stop();
        showInfo("STOP");
    }
    catch(e){}
}

function pauseResume()
{
    try
    {
        if(paused)
        {
            gSTB.Play(STREAM_URL);
            paused = false;
            showInfo("PLAY");
        }
        else
        {
            gSTB.Pause();
            paused = true;
            showInfo("PAUSE");
        }
    }
    catch(e){}
}

function volumeUp()
{
    try
    {
        volume = gSTB.GetVolume();

        volume += 5;

        if(volume > 100)
            volume = 100;

        gSTB.SetVolume(volume);

        showInfo("VOL: " + volume);
    }
    catch(e){}
}

function volumeDown()
{
    try
    {
        volume = gSTB.GetVolume();

        volume -= 5;

        if(volume < 0)
            volume = 0;

        gSTB.SetVolume(volume);

        showInfo("VOL: " + volume);
    }
    catch(e){}
}

function toggleMute()
{
    try
    {
        if(!muted)
        {
            volume = gSTB.GetVolume();
            gSTB.SetVolume(0);
            muted = true;
            showInfo("MUTE");
        }
        else
        {
            gSTB.SetVolume(volume);
            muted = false;
            showInfo("UNMUTE");
        }
    }
    catch(e){}
}

window.onload = function()
{
    try
    {
        volume = gSTB.GetVolume();
    }
    catch(e){}

    startPlayback();
};

document.onkeydown = function(event)
{
    var key = event.keyCode;

    switch(key)
    {
        case 82: // PLAY/PAUSE
            pauseResume();
            return false;

        case 83: // STOP
            stopPlayback();
            return false;

        case 8: // BACK
            stopPlayback();

            try
            {
                history.back();
            }
            catch(e){}

            return false;

        case 27: // MENU
            return true;

        case 107: // VOL+
            volumeUp();
            return false;

        case 109: // VOL-
            volumeDown();
            return false;

        case 192: // MUTE
            toggleMute();
            return false;

        case 112: // RED
            setViewport70();
            return false;

        case 113: // GREEN
            setFullscreen();
            return false;

        case 114: // YELLOW
            window.location.reload();
            return false;

        case 115: // BLUE
            showInfo(
                "MAG322<br>" +
                "JS API 344<br>" +
                "Volume: " + volume
            );
            return false;

        case 13: // OK
            stopPlayback();

            setTimeout(function(){
                startPlayback();
            },500);

            return false;
    }

    return true;
};

</script>

</body>
</html>
