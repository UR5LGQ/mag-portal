<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IPTV & YouTube Transcoder Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; padding: 20px; text-align: center; }
        .card { background: white; max-width: 500px; margin: 30px auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: left; }
        h2 { margin-top: 0; color: #0066cc; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input[type="submit"] { background: #0066cc; color: white; border: none; padding: 12px 20px; margin-top: 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        input[type="submit"]:hover { background: #0052a3; }
        .status { background: #e2f0d9; color: #385723; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; display: {% if status %}block{% else %}none{% endif %}; }
        .info-box { background: #eee; padding: 10px; border-radius: 4px; font-size: 13px; font-family: monospace; word-break: break-all; margin-top: 15px; }
    </style>
</head>
<body>
    <iframe src=» https://m.youtube.com/@hatanatata/videos» height=»500» width=»900»></iframe>
    <div class="card">
        <h2>Управление IPTV + YouTube</h2>
        <div class="status">{{ status }}</div>
        <form method="post" action="/admin/save">
            <label>Ссылка на IPTV (.m3u) ИЛИ Плейлист YouTube:</label>
            <input type="text" name="playlist_url" value="{{ config.playlist_url }}" required>
            <label>Качество сжатия видео (Разрешение):</label>
            <select name="quality">
                <option value="426:240|500k">240p (Экономия максимальная ~130 МБ/час)</option>
                <option value="640:360|750k">360p (Очень экономно ~220 МБ/час)</option>
                <option value="854:480|1000k">480p (Оптимально для мобильного ~360 МБ/час)</option>
                <option value="1280:720|1250k">720p HD (Хорошее качество ~580 МБ/час)</option>
            </select>
            <input type="submit" value="Сохранить и Обновить">
        </form>
        <div class="info-box">
            <strong>Ссылка для вашей приставки:</strong><br>
            http://{{ host }}:8000/playlist.m3u<br><br>
            <strong>Элементов в базе:</strong> {{ channels_count }}
        </div>
    </div>
</body>
</html>
